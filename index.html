<!DOCTYPE html>
<html>
<head>
  <title>Containerized Comments</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .comment-container {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      background: #fff;
    }

    .comment-frame {
      width: 100%;
      border: none;
      background: transparent;
      min-height: 100px;
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
      background: #f5f5f5;
    }

    #comments {
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .comment-container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>Comments</h1>
  <div id="comments"></div>

  <script type="importmap">
    {
      "imports": {
        "htm/react": "https://unpkg.com/htm@3.1.1/preact/standalone.mjs",
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>

  <script type="module">
    import { html, React } from 'htm/react';
    import { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';

    function Comment({ content, author, created_at }) {
      const [frameLoaded, setFrameLoaded] = useState(false);
      const frameId = `comment-${Math.random().toString(36).substr(2, 9)}`;

      useEffect(() => {
        if (!frameLoaded) return;

        const frame = document.getElementById(frameId);
        const doc = frame.contentDocument;

        // Setup sandbox environment
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html>
            <head>
              <style>
                body { 
                  font-family: system-ui, sans-serif;
                  margin: 0;
                  padding: 0;
                }
                .author {
                  font-weight: bold;
                  margin-bottom: 5px;
                }
                .date {
                  color: #666;
                  font-size: 0.9em;
                }
                .content {
                  margin-top: 10px;
                  word-break: break-word;
                }
              </style>
            </head>
            <body>
              <div class="author">@${author.username}</div>
              <div class="date">${new Date(created_at).toLocaleDateString()}</div>
              <div class="content">${content}</div>
            </body>
          </html>
        `);
        doc.close();
      }, [frameLoaded]);

      return html`
        <div class="comment-container">
          <iframe 
            id=${frameId}
            class="comment-frame"
            sandbox="allow-same-origin"
            onLoad=${() => setFrameLoaded(true)}
          />
        </div>
      `;
    }

    function CommentList() {
      const [comments, setComments] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [metadata, setMetadata] = useState(null);

      useEffect(() => {
        async function fetchCommentsAndMetadata() {
          try {
            const project = await window.websim.getCurrentProject();
            
            // Fetch comments and project data in parallel
            const [commentsResponse, projectResponse] = await Promise.all([
              fetch(`/api/v1/projects/${project.id}/comments`),
              fetch(`/api/v1/projects/${project.id}`)
            ]);

            const [commentsData, projectData] = await Promise.all([
              commentsResponse.json(),
              projectResponse.json()
            ]);

            setComments(commentsData.comments.data.map(c => c.comment));
            setMetadata({
              commentsCount: commentsData.comments.meta.count || 0,
              project: projectData.project,
              commentsMode: projectData.project.comments_mode
            });
          } catch (err) {
            setError('Failed to load comments');
            console.error('Error fetching comments:', err);
          } finally {
            setLoading(false);
          }
        }
        
        fetchCommentsAndMetadata();
      }, []);

      if (loading) return html`<div>Loading comments...</div>`;
      if (error) return html`<div style=${{color: 'red'}}>${error}</div>`;

      return html`
        <div>
          ${metadata?.commentsMode === 'closed' ? html`
            <div style=${{margin: '10px 0', color: '#666'}}>
              Comments are closed for this project
            </div>
          ` : null}
          
          <div style=${{margin: '10px 0', color: '#666'}}>
            ${metadata?.commentsCount} comment${metadata?.commentsCount !== 1 ? 's' : ''}
          </div>

          ${comments.map(comment => html`
            <${Comment} 
              key=${comment.id}
              content=${comment.raw_content || ''} 
              author=${comment.author}
              created_at=${comment.created_at}
            />
          `)}
        </div>
      `;
    }

    const root = createRoot(document.getElementById('comments'));
    root.render(html`<${CommentList} />`);
  </script>

</body>
</html>
